# Ballot Guide — Local Development
# Run from repo root: docker compose -f infra/docker-compose.yml up

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ballot-data:/data
    env_file:
      - ../.env
    environment:
      - DB_PATH=/data/ballot-guide.db
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ballot-data:
